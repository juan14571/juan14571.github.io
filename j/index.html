  <!-- CONTENEDOR DEL PARALLAX -->
  <div id="parallax-container">
    <div class="layer" id="layer1"></div>
    <div class="layer" id="layer2"></div>
    <div class="layer" id="layer3"></div>

    <!-- Personajes en primer plano -->
    <img src="img/fondo 3-Photoroom.png" alt="Beru" class="beru">
    <img src="img/fondo 4-Photoroom.png" alt="Igris" class="igris">
    <img src="img/fondo 5-Photoroom.png" alt="Jing" class="jing">
  </div>

  <!-- CONTENIDO DE LA PÁGINA -->
  <section class="contenido">
    <h2>Texto</h2>
    <p>Párrafo de ejemplo con desplazamiento parallax.</p>
    <div style="height: 1000px;"></div>
    <p>Fin de la página.</p>
  </section>

  <!-- SCRIPT PARALLAX -->
  <script>
    document.addEventListener('scroll', function () {
      const scrollY = window.scrollY;

      // Capas de fondo
      const layer1 = document.getElementById('layer1');
      const layer2 = document.getElementById('layer2');
      const layer3 = document.getElementById('layer3');

      // Diferentes velocidades
      layer1.style.transform = `translateY(${scrollY * 0.3}px)`; // más lento
      layer2.style.transform = `translateY(${scrollY * 0.5}px)`;
      layer3.style.transform = `translateY(${scrollY * 0.7}px)`; // más rápido
    });
  </script>
</body>
